[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "bo-to-powerbi"
version = "1.0.0"
description = "Automated SAP BusinessObjects to Power BI migration tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Office/Business",
]

[project.optional-dependencies]
fabric = ["azure-identity>=1.15.0", "requests>=2.31.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.3.0", "pyright>=1.1.350"]

[project.scripts]
bo-migrate = "migrate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["bo_export", "powerbi_import"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
